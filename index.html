<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Login | Week 3 Task</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Glowing Background Circles */
        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            animation: float 6s ease-in-out infinite alternate;
        }

        .circle-1 {
            width: 280px;
            height: 280px;
            background: #6366f1;
            top: 10%;
            left: 15%;
        }

        .circle-2 {
            width: 300px;
            height: 300px;
            background: #ec4899;
            bottom: 10%;
            right: 15%;
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-20px) scale(1.05); }
        }

        /* Glassmorphism Card Container */
        .login-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 380px;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            color: #ffffff;
            text-align: center;
        }

        .login-card h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #a5b4fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-card p {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 28px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #cbd5e1;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            font-size: 14px;
            color: #ffffff;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: #64748b;
        }

        /* Focus Neon Glow Effect */
        .input-group input:focus {
            border-color: #f472b6;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(244, 114, 182, 0.3);
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            margin-bottom: 25px;
            color: #94a3b8;
        }

        .options label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .options input[type="checkbox"] {
            accent-color: #ec4899;
        }

        .options a {
            color: #f472b6;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .options a:hover {
            color: #a5b4fc;
            text-decoration: underline;
        }

        /* Glowing Gradient Button */
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.35);
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(236, 72, 153, 0.5);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .signup-text {
            margin-top: 24px;
            font-size: 13px;
            color: #94a3b8;
        }

        .signup-text a {
            color: #a5b4fc;
            font-weight: 600;
            text-decoration: none;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Background Animated Blobs -->
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>

    <!-- Login Glass Card -->
    <div class="login-card">
        <h2>Welcome Back</h2>
        <p>Enter your credentials to continue</p>

        <form action="#">
            <div class="input-group">
                <label for="email">EMAIL ADDRESS</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>

            <div class="input-group">
                <label for="password">PASSWORD</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="options">
                <label><input type="checkbox"> Remember me</label>
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-login">Sign In ✨</button>
        </form>

        <p class="signup-text">Don't have an account? <a href="#">Create one</a></p>
    </div>

</body>
</html>
